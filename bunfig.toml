[install]
linker = "hoisted"

[install.scopes]
"@cosmicdriftgamestudio" = { url = "https://npm.pkg.github.com", token = "$GITHUB_TOKEN" }

[test]
# Unit-test default: polyfill-only preload (no service-URL env, no DOM).
# Integration runs pull service defaults via bunfig.integration.toml →
# preload/env. DOM/render tests (*.test.tsx) run via
# bunfig.dom.toml — happy-dom is not loaded here.
preload = [
  "@cosmicdrift/kumiko-testing/preload/temporal",
  "@cosmicdrift/kumiko-testing/preload/scrub-env",
]

# *.spec.ts belongs to Playwright (e2e/ folder). Otherwise bun test tries to
# load it and crashes because Playwright expects its own test() globals
# (see "Playwright Test did not expect test() to be called here").
pathIgnorePatterns = [
  "**/*.integration.test.ts",
  # *.test.tsx needs happy-dom → separate run via bunfig.dom.toml
  # (`bun run test:dom`). Excluded here so the node-only default gets no
  # window global.
  "**/*.test.tsx",
  "**/e2e/**",
  "**/*.spec.ts",
  "**/*.spec.tsx",
  # dist/ holds compiled .js with the same test names as src/ —
  # without this exclude bun test scans BOTH copies (duplicates fight over
  # ephemeral DBs and look like flaky tests).
  "**/dist/**",
]

