# Dedizierter Lauf für DOM/Render-Tests (*.test.tsx). Der Default-Unit-Lauf
# (bunfig.toml / bunfig.ci.toml) lädt happy-dom nicht mehr — node-only Tests
# bekommen kein fake-window mehr untergelegt (Issue #1330).
#
# Aufruf: bun test --config=bunfig.dom.toml --timeout=15000 .test.tsx
# (bun filtert positional args als Substring auf den Dateipfad.)
#
# concurrency=1: shared single-process happy-dom kollidiert unter
# Parallelität (RAM + React event delegation, #457).

[install]
linker = "hoisted"

[install.scopes]
"@cosmicdriftgamestudio" = { url = "https://npm.pkg.github.com", token = "$GITHUB_TOKEN" }

[test]
preload = [
  "./test-setup/app-define-resolver.ts",
  "@cosmicdrift/kumiko-testing/preload/temporal",
  "@cosmicdrift/kumiko-testing/preload/scrub-env",
  "./test-setup/dom.preload.ts",
]
concurrency = 1
# No `timeout` key here: bun's bunfig parser has no such key in its [test]
# section and ignores it silently (#3078, same as #2796 for the integration
# config). The real 15s budget is `--timeout=15000` on every
# `bun test --config=bunfig.dom.toml` call — package.json `test:dom` and the
# DOM steps in bin/kumiko-legacy.ts.

# Coverage für den Badge-Merge — der dom-Lauf ist der EINZige, der die
# tsx-abgedeckten UI-Dateien (renderer-web, widgets, bundled-features web)
# ausführt; ohne dieses lcov fehlen sie im Badge (waren vor #1330 im
# unit-lcov enthalten). coverage-badge.ts merged coverage/dom als dritte
# Quelle neben unit+integration.
coverage = true
coverageReporter = ["lcov"]
coverageDir = "coverage/dom"
coveragePathIgnorePatterns = [
  "**/scripts/**",
  "**/bin/**",
  "**/test-setup/**",
  "**/tmp/**",
  "integration.guard.ts",
]

pathIgnorePatterns = [
  "**/e2e/**",
  "**/*.spec.ts",
  "**/*.spec.tsx",
  "**/dist/**",
  # #457: diese Screen-Tests korruptieren im shared single-process happy-dom
  # (CI-only — lokal ist der volle tsx-Lauf grün). Sie laufen je in eigenem
  # `bun test`-Prozess via bunfig.ci-dom.toml (`bun run test:dom:isolated`).
  "**/user-data-rights/web/__tests__/deletion-screens.test.tsx",
  "**/user-data-rights/web/__tests__/privacy-center-screen.test.tsx",
  # Singleton entityEdit create->update: fires fireEvent.change immediately
  # followed by fireEvent.click right after an async load settles — the
  # #457 pattern (CI-only, full local tsx run is green). Split out of
  # kumiko-screen.test.tsx into its own file so only these 4 tests move to
  # the isolated runner, not the whole 2600+ line parent file (#2495).
  "**/renderer-web/src/__tests__/kumiko-screen-singleton-entity-edit.test.tsx",
  # Same #457 singleton create->update pattern, split out of return-to.test.tsx.
  "**/renderer-web/src/__tests__/return-to-singleton.test.tsx",
  # Same #457 pattern: entityEdit waits for an async load, then types and submits.
  "**/renderer-web/src/__tests__/kumiko-screen-money-tenant-currency.test.tsx",
  # Same #457 pattern on the actionForm side of the same feature (fw#2839).
  "**/renderer-web/src/__tests__/kumiko-screen-action-form-money-currency.test.tsx",
]
