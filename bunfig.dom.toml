# Dedizierter Lauf für DOM/Render-Tests (*.test.tsx). Der Default-Unit-Lauf
# (bunfig.toml / bunfig.ci.toml) lädt happy-dom nicht mehr — node-only Tests
# bekommen kein fake-window mehr untergelegt (Issue #1330).
#
# Aufruf: bun test --config=bunfig.dom.toml --timeout=15000 .test.tsx
# (bun filtert positional args als Substring auf den Dateipfad.)

[install]
linker = "hoisted"

[install.scopes]
"@cosmicdriftgamestudio" = { url = "https://npm.pkg.github.com", token = "$GITHUB_TOKEN" }

[test]
preload = [
  "@cosmicdrift/kumiko-testing/preload/temporal",
  "@cosmicdrift/kumiko-testing/preload/scrub-env",
  "@cosmicdrift/kumiko-testing/preload/dom",
]
# No `timeout` or `concurrency` key here: bun's bunfig parser has neither
# key in its [test] section and ignores both silently (#3078, same as #2796
# for the integration config). The real 15s budget is `--timeout=15000` on
# every `bun test --config=bunfig.dom.toml` call — package.json `test:dom`
# and the DOM steps in bin/kumiko-legacy.ts. Without `--concurrent`, tests
# run sequentially anyway.

# Coverage für den Badge-Merge — der dom-Lauf ist der EINZige, der die
# tsx-abgedeckten UI-Dateien (renderer-web, widgets, bundled-features web)
# ausführt; ohne dieses lcov fehlen sie im Badge (waren vor #1330 im
# unit-lcov enthalten). coverage-badge.ts merged coverage/dom als dritte
# Quelle neben unit+integration.
coverage = true
coverageReporter = ["lcov"]
coverageDir = "coverage/dom"
coveragePathIgnorePatterns = [
  "**/scripts/**",
  "**/bin/**",
  "**/test-setup/**",
  "**/tmp/**",
  "integration.guard.ts",
]

pathIgnorePatterns = [
  "**/e2e/**",
  "**/*.spec.ts",
  "**/*.spec.tsx",
  "**/dist/**",
]
