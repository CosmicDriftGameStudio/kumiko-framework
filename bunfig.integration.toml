[install]
linker = "hoisted"

[install.scopes]
"@cosmicdriftgamestudio" = { url = "https://npm.pkg.github.com", token = "$GITHUB_TOKEN" }

[test]
preload = [
  "./test-setup/app-define-resolver.ts",
  "@cosmicdrift/kumiko-testing/preload/temporal",
  "@cosmicdrift/kumiko-testing/preload/env",
]
# bun ignores `timeout` here (kumiko-framework#2796) — the real 15s budget is
# `--timeout=15000` on every `bun test --config=bunfig.integration.toml` call
# (scripts/run-integration-tests.ts, package.json test:integration:perf:*).

# Same product-code scope as bunfig.ci.toml (run-integration-tests.ts adds
# --coverage on the CLI when KUMIKO_INTEGRATION_COVERAGE=1).
coveragePathIgnorePatterns = [
  "**/scripts/**",
  "**/bin/**",
  "**/test-setup/**",
]

pathIgnorePatterns = [
  "**/e2e/**",
  "**/*.spec.ts",
  "**/*.spec.tsx",
  "**/dist/**",
]
