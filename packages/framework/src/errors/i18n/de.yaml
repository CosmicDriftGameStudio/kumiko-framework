# i18n-Texte für die Reason-Kataloge aus reasons.ts (deutsch).
#
# Schema pro Reason-Key — der Key ist wörtlich der Reason-Wert, Punkte
# inklusive: FrameworkReasons bleibt präfixfrei (`stale_state`), AgentReasons
# behält seinen Namespace innerhalb eines flachen Keys
# (`agent.tool_not_allowed`), nie als verschachtelte `agent:`-Map:
#
#   <reason_key>:
#     endUser: |
#       Was der End-User in der App-UI sieht.
#       Verständliche Sprache, Handlungs-Aufforderung wenn anwendbar.
#     developer: |
#       Technischer Hintergrund + Hinweise zum Konfigurieren / Verhindern.
#       Für App-Owner und Designer-Nutzer.

stale_state:
  endUser: |
    Jemand anderes hat dieses Element zwischenzeitlich geändert.
    Bitte Seite neu laden und nochmal speichern.
  developer: |
    `ConflictError` tritt auf wenn ein atomic UPDATE den Optimistic-Locking-
    Race verloren hat — ein anderer Writer hat die Row zwischen Snapshot
    und WHERE-Clause bewegt.

    Standard-Verhalten im Client-SDK: Toast mit "Bitte neu laden" anzeigen
    und Entity neu fetchen.

    Wenn du Conflict-Handling pro Entity anpassen willst, siehe
    [Optimistic-Locking-Konfiguration](/en/concepts/commands/).

invalid_transition:
  endUser: |
    Diese Aktion ist im aktuellen Status nicht möglich.
    Der Datensatz muss sich in einem bestimmten Zustand befinden,
    damit dieser Schritt erlaubt ist.
  developer: |
    `UnprocessableError` beim `guardTransition`: ein State-Machine-Übergang
    wurde abgelehnt weil der aktuelle Zustand nicht zu den erlaubten
    Quell-Zuständen gehört.

    `details.from`, `details.to` und `details.validTargets` enthalten die
    Diagnose. Definiere erlaubte Übergänge in
    `r.entity({ stateMachine: ... })`,
    oder prüfe vor dem Aufruf den aktuellen Zustand.

field_access_denied:
  endUser: |
    Du darfst dieses Feld nicht ändern.
    Wende dich an einen Administrator wenn du diese Berechtigung brauchst.
  developer: |
    `AccessDeniedError` beim Field-Level-Write-Check des Dispatchers: ein
    Schreibversuch auf ein Feld wurde abgelehnt weil die aktuelle Rolle
    keinen Zugriff hat.

    `details.field` und `details.handler` enthalten die Diagnose.
    Konfiguriere Field-Access in der Entity-Definition
    (siehe [Permissions](/en/guides/field-level-permissions/)) oder fordere die
    nötige Rolle an.

delete_restricted:
  endUser: |
    Dieser Eintrag kann nicht gelöscht werden weil andere Datensätze noch
    darauf verweisen.
    Lösche zuerst die abhängigen Einträge.
  developer: |
    `ConflictError` beim Cascade-Delete-Guard: das Löschen wurde verhindert
    weil dependent Rows existieren.

    `details.blockingEntity`, `details.entity` und `details.entityId` zeigen
    welche Relation blockiert. Setze `relation.onDelete` auf `"cascade"`
    oder `"setNull"` wenn automatisches Aufräumen gewünscht ist, oder lösche
    die abhängigen Rows zuerst.

feature_disabled:
  endUser: |
    Diese Funktion ist aktuell nicht verfügbar.
    Versuche es später noch einmal oder kontaktiere den Administrator.
  developer: |
    `FeatureDisabledError`: das Feature des aufgerufenen Handlers wurde
    global deaktiviert. Distinct von `access_denied` — Clients sollten
    "Funktion gerade nicht verfügbar" zeigen, nicht "keine Berechtigung".

    `details.feature` und `details.handler` zeigen welches Feature/Handler.
    Aktiviere das Feature via Feature-Toggle oder Routing-Config (siehe
    [Feature-Toggles](/en/feature-reference/feature-toggles/)).

system_identity_switch_denied:
  endUser: |
    Diese Aktion ist nicht erlaubt.
    Wende dich an einen Administrator wenn du glaubst, dass das ein Fehler ist.
  developer: |
    `AccessDeniedError`: ein Handler oder Hook hat `ctx.queryAs`/`ctx.writeAs`
    mit einer SYSTEM-Identität aufgerufen, ohne `r.systemScope()`-Handler, Job
    zu sein oder `escapeHatch: { reason }` zu deklarieren.

    Deklariere `escapeHatch: { reason: "..." }` am Write- oder Query-Handler
    (oder am `r.hook(...)`-Aufruf, wenn der Wechsel in einem Hook passiert),
    oder verlagere die Logik in ein `r.systemScope()`-Feature oder einen Job.

identity_switch_denied:
  endUser: |
    Diese Aktion ist nicht erlaubt.
    Wende dich an einen Administrator wenn du glaubst, dass das ein Fehler ist.
  developer: |
    `AccessDeniedError`: ein Handler oder Hook hat `ctx.queryAs`/`ctx.writeAs`
    mit einer anderen Identität als dem eigenen Caller aufgerufen — andere
    User-ID, anderer Tenant, andere Claims oder Origin, oder Rollen, die der
    Caller nicht hat — ohne `r.systemScope()`-Handler, Job zu sein oder
    `escapeHatch: { reason }` zu deklarieren. Der Wechsel auf den Caller selbst
    oder eine Teilmenge seiner Rollen bleibt frei.

    Deklariere `escapeHatch: { reason: "..." }` am Write- oder Query-Handler
    (oder am `r.hook(...)`-Aufruf, wenn der Wechsel in einem Hook passiert),
    oder verlagere die Logik in ein `r.systemScope()`-Feature oder einen Job.

tenant_override_requires_system_admin:
  endUser: |
    Diese Aktion ist für eine andere Organisation nicht erlaubt.
    Wende dich an einen Administrator wenn du glaubst, dass das ein Fehler ist.
  developer: |
    `AccessDeniedError`: der Payload enthielt `tenantIdOverride`, der Caller
    ist aber kein SystemAdmin. Der Dispatcher prüft den per Schema geparsten
    Payload jedes Write-, Query- und Stream-Handlers, bevor der Handler läuft;
    betroffen sind also nur Handler, die das Feld deklarieren.

    Sende die Anfrage als SystemAdmin oder lass `tenantIdOverride` weg und
    arbeite im eigenen Tenant des Callers. Für andere Cross-Tenant-Felder
    `mayOverrideTenant(user)` im Handler verwenden.

unsafe_all_tenants_denied:
  endUser: |
    Diese Aktion ist nicht erlaubt.
    Wende dich an einen Administrator wenn du glaubst, dass das ein Fehler ist.
  developer: |
    `AccessDeniedError`: ein Handler oder Hook hat
    `ctx.queryProjection(qualifiedName, { unsafeAllTenants: true })`
    aufgerufen, ohne `r.systemScope()`-Handler zu sein oder
    `escapeHatch: { reason }` zu deklarieren.

    Deklariere `escapeHatch: { reason: "..." }` am Write-, Query- oder
    Stream-Handler (oder am `r.hook(...)`-Aufruf, wenn der Read in einem Hook
    passiert), oder verlagere die Logik in ein `r.systemScope()`-Feature.

member_resolution_denied:
  endUser: |
    Diese Aktion ist nicht erlaubt.
    Wende dich an einen Administrator wenn du glaubst, dass das ein Fehler ist.
  developer: |
    `AccessDeniedError`: `ctx.queryAsMember(userId, ...)` konnte für `userId`
    keine aktive Mitgliedschaft im Tenant des Aufrufers auflösen (kein
    Mitglied, Principal gesperrt, oder der Tenant befindet sich im Teardown).
    Bewusst generisch — `details` verrät nie, welche Prüfung fehlgeschlagen ist.

member_resolution_read_only:
  endUser: |
    Diese Aktion ist nicht erlaubt.
    Wende dich an einen Administrator wenn du glaubst, dass das ein Fehler ist.
  developer: |
    `AccessDeniedError`: ein über `ctx.queryAsMember` erreichter Query-Handler
    hat versucht zu schreiben (`ctx.write`/`writeAs`/`appendEvent`/
    `jobRunner`/...). Aufgelöste Member-Principals sind nur lesend — es gibt
    kein `writeAsMember`.

subject_erased:
  endUser: |
    Die Daten dieser Person wurden gelöscht und können nicht mehr geändert werden.
  developer: |
    `ConflictError`: ein Write hat ein Personendaten-Feld (`pii`, `userOwned`,
    `tenantOwned`) eines Betroffenen berührt, dessen Schlüssel gelöscht wurde
    (Crypto-Shredding). Ein vergessener Betroffener bekommt nie neue Daten; der
    Verschlüsselungsschritt lehnt den Write ab, statt einen neuen Schlüssel
    anzulegen.

public_intake_required:
  endUser: |
    Diese Aktion ist nicht erlaubt.
    Wende dich an einen Administrator wenn du glaubst, dass das ein Fehler ist.
  developer: |
    `AccessDeniedError`: ein Write unter einem anonymen Wurzel-Handler hat ein
    Personendaten-Feld (`pii` / `userOwned` / `recordOwned`) geschrieben, direkt
    oder über `ctx.write`/`writeAs`/`queryAs` oder einen Hook. `details` nennen
    `rootHandler`, `target` und `fields`. Ist der anonyme Intake gewollt, am
    Wurzel-Handler `access: { roles: [..., "anonymous"], personalData: "public-intake" }`
    deklarieren.

irreversible_operation_requires_high_risk:
  endUser: |
    Diese Aktion ist nicht erlaubt.
    Wende dich an einen Administrator wenn du glaubst, dass das ein Fehler ist.
  developer: |
    `AccessDeniedError`: der direkt aufgerufene Einstiegs-Handler führt ein
    hartes Delete oder `forget` aus (`details.operation`), aber sein
    aufgelöstes Agent-Risiko (`details.resolvedRisk`) liegt unter `"high"`.
    `details.handler` nennt den Einstiegs-Handler — eine Delegation über
    `ctx.write`/`writeAs` aus einem Handler mit niedrigerem Risiko erbt das
    deklarierte Risiko des inneren Handlers nicht.

    `agent: { risk: "high" }` am genannten Handler deklarieren.

instruction_field_write_requires_high_risk:
  endUser: |
    Diese Aktion ist nicht erlaubt.
    Wende dich an einen Administrator wenn du glaubst, dass das ein Fehler ist.
  developer: |
    `AccessDeniedError`: der direkt aufgerufene Einstiegs-Handler schreibt ein
    Feld mit `readAsInstruction: true` (`details.fields`), aber sein
    aufgelöstes Agent-Risiko (`details.resolvedRisk`) liegt unter `"high"`.
    `details.handler` nennt den Einstiegs-Handler — eine Delegation über
    `ctx.write`/`writeAs` aus einem Handler mit niedrigerem Risiko erbt das
    deklarierte Risiko des inneren Handlers nicht.

    `agent: { risk: "high" }` am genannten Handler deklarieren.

agent.tool_not_allowed:
  endUser: |
    Dieses Tool ist im aktuellen Modus nicht verfügbar.
    Stell den Assistenten auf einen Modus um, der diese Aktion abdeckt, oder
    führe sie selbst in der App aus.
  developer: |
    Kein `AccessDeniedError`. Drei Auslöser:
    - Agent-Loop: das Modell hat einen Tool-Namen außerhalb des für diesen Lauf
      gebauten Katalogs angefragt (halluzinierter Name oder ein Handler, den der
      Lauf nicht freigibt); die Loop schreibt einen error-Turn.
    - Rule-Validierung: `UnprocessableError`, wenn der Handler einer neuen
      Permission-Rule im rollengefilterten Manifest des Callers fehlt.
    - `UnprocessableError`, wenn `ai-agent-edit` nicht gemountet ist.

    Der Katalog wird aus der gemounteten Registry abgeleitet
    (`buildToolCatalog`) — ein Handler ohne `description` wird also gar nicht
    erst zum Tool. Handler beschreiben oder den Agent-Modus weiten, wenn der
    Call funktionieren sollte.

agent.iteration_limit:
  endUser: |
    Der Assistent hat die maximale Anzahl an Schritten erreicht, ohne eine
    eindeutige Antwort zu finden.
    Bitte formuliere die Anfrage um oder teile sie in kleinere Schritte.
  developer: |
    Kein Error. Der Lauf endet mit einem `clarify`-Turn (`payload.reason`), sobald
    `MAX_AGENT_ROUNDS` erreicht ist, ohne dass das Modell eine Endantwort
    produziert hat — meist ein Tool, das immer wieder denselben Fehler liefert,
    oder eine Aufgabe, die mehr Schritte braucht als das Limit erlaubt.

    Aufgabe verkleinern oder den sich wiederholenden Tool-Call fixen. Die
    Turn-Historie der Unterhaltung zeigt, welcher es war.

agent.high_risk_no_always:
  endUser: |
    Für risikoreiche Aktionen kann „immer erlauben“ nicht gesetzt werden.
    Jeder Lauf dieser Aktion braucht deine ausdrückliche Bestätigung.
  developer: |
    `UnprocessableError` beim Anlegen einer Permission-Rule: für einen Handler
    mit `agent: { risk: "high" }` wurde `always` angefragt. High-Risk-Handler
    lassen nur Einzelfreigaben zu; `details.handlerQn` nennt den Handler.

    Deklariertes Risiko senken, wenn die Aktion wirklich Routine ist, ansonsten
    ist die Einzelfreigabe genau das gewollte Verhalten.
